[package]
name = "bitview_mcp"
description = "Stateless MCP bridge to the Bitview REST API"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.release]
pre-release-replacements = [
    { file = "server.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1, prerelease = true },
]

[dependencies]
axum = { workspace = true }
base64 = "0.23.1"
brk_logger = { workspace = true }
rmcp = { version = "3.3.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
tracing = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "bitview_mcp"
path = "src/main.rs"
